name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Verify lock and sync typed stack
        run: |
          uv lock --check
          uv sync --extra engine --extra render --extra stats
      # Round-9 release guard: every public version surface (pyproject, package,
      # CITATION, zenodo, marketplace plugin, uv.lock) must agree; on a vX.Y.Z tag
      # it additionally requires the finalized changelog heading and release date.
      - name: Release version alignment
        run: uv run python scripts/check_release_versions.py
      - name: Ruff
        run: uv run ruff check .
      - name: Strict mypy
        run: uv run mypy cmig
      # Workflow-hash analogue of the SC-5 golden gate. Needs no solver and no license, so it runs
      # on every matrix leg: a change to the workflow-envelope serialization silently rewrites
      # every published workflow run_hash, and nothing else would catch it.
      - name: Workflow-envelope serialization gate
        run: uv run cmig golden verify-envelope
      - name: License-free deterministic core tests
        run: >-
          uv run pytest -q
          tests/test_sign.py
          tests/test_namespace_gate.py
          tests/test_run_hash.py
          tests/test_stats.py
          tests/test_model_quality.py
          tests/test_workflow_manifest.py
          tests/test_workflow_envelope_golden.py

  package:
    name: Build and inspect distributions
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv build
      - name: Reject private/runtime/large-data package members
        run: uv run python scripts/audit_distribution.py dist/*

  solver-tests:
    name: Full solver, golden, GUI, and publication smoke
    needs: [quality, package]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.repository == 'jyryu3161/CMIG' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra engine --extra gui --extra render --extra stats
      - name: Configure Gurobi WLS license
        shell: bash
        env:
          GRB_WLSACCESSID: ${{ secrets.GRB_WLSACCESSID }}
          GRB_WLSSECRET: ${{ secrets.GRB_WLSSECRET }}
          GRB_LICENSEID: ${{ secrets.GRB_LICENSEID }}
        run: |
          test -n "$GRB_WLSACCESSID" || {
            echo "::error::Gurobi WLS secrets are required for solver-tests."
            exit 1
          }
          {
            echo "WLSACCESSID=$GRB_WLSACCESSID"
            echo "WLSSECRET=$GRB_WLSSECRET"
            echo "LICENSEID=$GRB_LICENSEID"
          } > "$HOME/gurobi.lic"
          echo "GRB_LICENSE_FILE=$HOME/gurobi.lic" >> "$GITHUB_ENV"
      - name: MICOM-version golden gate
        run: uv run cmig golden verify
      - name: Full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q
      - name: Integrated publication benchmark smoke
        run: uv run pytest -q tests/test_publication_benchmark.py
